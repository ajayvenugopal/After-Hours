[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdock"
version = "0.1.0"
description = "AgentDock: cloud planning and review with local coding agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["prompt-toolkit>=3.0.50,<4"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["coding-agents", "terminal", "ollama", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/ajayvenugopal/After-Hours"
Repository = "https://github.com/ajayvenugopal/After-Hours"
Issues = "https://github.com/ajayvenugopal/After-Hours/issues"

[project.scripts]
agentdock = "agentdock.cli:agentdock_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentdock*"]
namespaces = false
