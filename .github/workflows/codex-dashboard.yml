name: Codex Dashboard
on:
  pull_request:
    paths: ['tools/codex-dashboard/**', '.github/workflows/codex-dashboard.yml']
  push:
    paths: ['tools/codex-dashboard/**', '.github/workflows/codex-dashboard.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/codex-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
