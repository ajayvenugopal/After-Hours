name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Swift tests
        run: swift test
      - name: Python tests
        run: python3 -m unittest discover -s Tests/BridgeTests -v
      - name: Build app bundle
        run: bash scripts/build.sh
